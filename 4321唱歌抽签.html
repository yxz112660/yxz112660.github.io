<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>无尽冬日4321区 · 歌唱抽签</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #0a1e2e 0%, #1f4057 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            position: relative;
        }

        body::before { content: "❄️"; position: fixed; top: 8px; left: 8px; font-size: 2.4rem; opacity: 0.15; transform: rotate(-12deg); z-index: 0; }
        body::after { content: "⛄"; position: fixed; bottom: 12px; right: 12px; font-size: 3rem; opacity: 0.12; transform: scaleX(-1); z-index: 0; }

        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 40px 40px 30px 30px;
            padding: 20px 16px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
        }

        /* 标题 */
        .header { text-align: center; margin-bottom: 18px; }
        .header h1 {
            font-size: 1.8rem; font-weight: 700; letter-spacing: 2px;
            display: inline-block; padding: 0 12px 8px;
            background: linear-gradient(180deg, #ddf0ff 0%, #add8f0 80%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 4px 16px rgba(0, 40, 70, 0.8);
        }
        .header h1 i { color: #f5d742; text-shadow: 0 0 14px #f5b342; margin: 0 6px; font-size: 1.8rem; background: none; -webkit-background-clip: unset; background-clip: unset; }
        .header .sub {
            display: block; font-size: 0.8rem; font-weight: 600; color: #c6e6ff;
            background: rgba(0, 20, 40, 0.35); backdrop-filter: blur(4px); border-radius: 60px;
            padding: 4px 20px; margin-top: -4px; display: inline-block; letter-spacing: 3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 加载状态 */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            gap: 16px;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f5c542;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: #c6e6ff;
            font-size: 1rem;
            font-weight: 600;
        }

        /* 自助抽签区 */
        .self-draw-area {
            background: rgba(255, 215, 100, 0.06);
            border-radius: 28px;
            padding: 16px 14px 18px;
            border: 1px solid rgba(255, 215, 100, 0.1);
            margin-bottom: 16px;
        }
        .self-draw-area .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
        }
        .self-draw-area input {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            color: #f5faff;
            font-size: 0.95rem;
            font-weight: 500;
            outline: 2px solid transparent;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
        }
        .self-draw-area input::placeholder { color: #b0d2ec; font-weight: 400; opacity: 0.7; }
        .self-draw-area input:focus {
            outline: 2px solid #f5b342;
            background: rgba(255, 255, 255, 0.14);
            border-color: #f5c542;
        }
        .self-draw-area .draw-btn {
            background: linear-gradient(145deg, #f5b042, #e0892a);
            border: none;
            padding: 0 20px;
            border-radius: 40px;
            color: #0d212f;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #8f5f1f;
            border: 1px solid #fad58c;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .self-draw-area .draw-btn i { font-size: 1.1rem; color: #2d1c06; }
        .self-draw-area .draw-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #8f5f1f;
        }
        .self-draw-area .draw-btn:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 1px 0 #8f5f1f;
            pointer-events: none;
        }

        .draw-result-msg {
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.25);
            color: #f5faff;
            font-weight: 600;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            border: 1px solid rgba(255, 215, 100, 0.08);
        }
        .draw-result-msg .highlight {
            color: #f5d742;
            font-size: 1.3rem;
            font-weight: 700;
            background: rgba(245, 183, 66, 0.15);
            padding: 0 14px;
            border-radius: 30px;
            border: 1.5px solid #f5b342;
            animation: pulse 0.8s ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.85); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .remain-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 6px 14px;
            background: rgba(0,0,0,0.18);
            border-radius: 30px;
            color: #aacfec;
            font-size: 0.82rem;
        }
        .remain-info .num { color: #f5d742; font-weight: 700; font-size: 1rem; }

        /* 选手列表 */
        .section-title {
            font-size: 1.1rem; font-weight: 600; color: #e4f4ff;
            border-bottom: 1.5px dashed #3a7b9c; padding-bottom: 8px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px;
        }
        .section-title i { color: #f5d742; font-size: 1.2rem; }

        .player-list {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 8px;
        }
        .player-list::-webkit-scrollbar { width: 4px; }
        .player-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 10px; }
        .player-list::-webkit-scrollbar-thumb { background: #4c8db0; border-radius: 10px; }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            padding: 6px 12px 6px 16px;
            margin-bottom: 5px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.15s;
            color: #e8f3fe;
            font-weight: 500;
            font-size: 0.9rem;
            gap: 4px;
            flex-wrap: wrap;
        }
        .player-item:hover { background: rgba(255, 255, 255, 0.07); border-color: #6aaac9; }
        .player-item .name { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 80px; }
        .player-item .name i { color: #9acfec; font-size: 0.85rem; width: 18px; text-align: center; }
        .player-item .name .player-name {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 16px;
            transition: 0.15s;
            font-size: 0.9rem;
        }
        .player-item .name .player-name:hover { background: rgba(255, 255, 255, 0.08); }
        .player-item .name .player-name.editing {
            background: rgba(245, 183, 66, 0.15);
            outline: 1.5px solid #f5b342;
        }
        .player-item .edit-input {
            background: rgba(255,255,255,0.08);
            border: 1.5px solid #f5b342;
            border-radius: 20px;
            padding: 2px 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            width: 100px;
            min-width: 60px;
        }
        .player-item .edit-input:focus { background: rgba(255,255,255,0.14); }
        .player-item .draw-status {
            font-size: 0.65rem;
            background: rgba(245, 197, 66, 0.12);
            padding: 1px 10px;
            border-radius: 30px;
            color: #f5d742;
            border: 1px solid rgba(245, 197, 66, 0.15);
            white-space: nowrap;
        }
        .player-item .actions {
            display: flex;
            gap: 2px;
            align-items: center;
            flex-shrink: 0;
        }
        .player-item .action-btn {
            background: transparent; border: none; color: #b0d0e6; cursor: pointer;
            font-size: 0.85rem; padding: 3px 8px; border-radius: 30px; transition: 0.15s;
        }
        .player-item .action-btn:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
        .player-item .action-btn.del:hover { background: rgba(220, 80, 80, 0.25); color: #ffb4b4; }
        .player-item .action-btn.edit:hover { background: rgba(245, 183, 66, 0.15); color: #f5d742; }
        .player-item .action-btn.save-edit { color: #5fdf7a; }
        .player-item .action-btn.save-edit:hover { background: rgba(95, 223, 122, 0.15); }
        .player-item .action-btn.cancel-edit { color: #ff8a8a; }
        .player-item .action-btn.cancel-edit:hover { background: rgba(255, 80, 80, 0.15); }
        .player-item.has-drawn { border-left: 3px solid #f5c542; background: rgba(245, 197, 66, 0.04); }
        .empty-hint { color: #9bbfd9; text-align: center; padding: 16px 8px; font-style: italic; opacity: 0.6; font-size: 0.9rem; }

        /* 结果展示 */
        .result-box {
            background: rgba(0, 15, 30, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 12px 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 120px;
        }
        .result-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 260px;
            overflow-y: auto;
            padding: 2px 4px;
        }
        .result-list::-webkit-scrollbar { width: 4px; }
        .result-list::-webkit-scrollbar-thumb { background: #4f8fb0; border-radius: 10px; }

        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 14px 6px 12px;
            border-radius: 40px;
            border-left: 4px solid #f7c35c;
            font-weight: 500;
            color: #f0fcff;
            font-size: 0.88rem;
            border: 1px solid rgba(255, 215, 120, 0.05);
        }
        .result-item .order {
            background: #1f4a62;
            border-radius: 30px;
            padding: 1px 12px;
            font-weight: 700;
            color: #f5e56b;
            font-size: 0.85rem;
            min-width: 36px;
            text-align: center;
            border: 1px solid #eab74a;
            flex-shrink: 0;
        }
        .result-item .rname { flex: 1; font-weight: 600; letter-spacing: 0.3px; font-size: 0.88rem; }
        .result-item .rname i { margin-right: 8px; color: #f5c542; font-size: 0.8rem; }
        .result-empty {
            color: #a5c8e3;
            text-align: center;
            padding: 24px 10px;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        /* 按钮 */
        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 12px;
            justify-content: center;
        }
        .btn-secondary {
            background: rgba(60, 120, 160, 0.2);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 7px 18px;
            border-radius: 40px;
            font-weight: 600;
            color: #d5ecff;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.82rem;
            box-shadow: 0 3px 0 #1c3f52;
        }
        .btn-secondary i { color: #b5d9f5; font-size: 0.85rem; }
        .btn-secondary:active { transform: translateY(2px); box-shadow: 0 1px 0 #1c3f52; }
        .btn-secondary:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1c3f52;
            pointer-events: none;
        }

        .footer-meta {
            margin-top: 14px;
            text-align: right;
            color: #7babc9;
            font-size: 0.7rem;
            letter-spacing: 1px;
            opacity: 0.5;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 10px;
        }

        /* 密码弹窗 - 手机优化 */
        .password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .password-modal {
            background: #1d3d52;
            padding: 30px 24px 32px;
            border-radius: 50px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            border: 1px solid #9acfec;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .password-modal h3 {
            color: #f5f9ff;
            font-size: 1.4rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .password-modal h3 i { color: #f5c542; }
        .password-modal input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: 2px solid transparent;
            transition: 0.2s;
            border: 1px solid #4d8aa8;
        }
        .password-modal input:focus {
            outline: 2px solid #7fc9f0;
            background: rgba(255,255,255,0.16);
        }
        .password-modal .pwd-actions {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .password-modal .pwd-actions button {
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .password-modal .pwd-actions .pwd-confirm {
            background: #f5b042;
            color: #1a2f3d;
            box-shadow: 0 4px 0 #8f5f1f;
        }
        .password-modal .pwd-actions .pwd-confirm:active { transform: translateY(3px); box-shadow: 0 1px 0 #8f5f1f; }
        .password-modal .pwd-actions .pwd-cancel {
            background: rgba(200, 70, 70, 0.3);
            color: #f0e6e6;
            border: 1px solid #b06a6a;
        }
        .password-modal .pwd-actions .pwd-cancel:active { transform: scale(0.96); }
        .pwd-error { color: #ffb0b0; margin-top: 10px; font-weight: 500; min-height: 24px; font-size: 0.9rem; }

        /* 手机适配 */
        @media (max-width: 420px) {
            .card { padding: 14px 12px 20px; border-radius: 28px; }
            .header h1 { font-size: 1.5rem; }
            .header h1 i { font-size: 1.4rem; }
            .self-draw-area { padding: 12px 10px 14px; }
            .self-draw-area input { padding: 10px 14px; font-size: 0.85rem; }
            .self-draw-area .draw-btn { padding: 0 14px; font-size: 0.85rem; }
            .draw-result-msg { font-size: 0.82rem; padding: 8px 12px; min-height: 40px; }
            .draw-result-msg .highlight { font-size: 1.1rem; padding: 0 10px; }
            .player-item { padding: 5px 10px 5px 12px; font-size: 0.82rem; }
            .player-item .edit-input { width: 70px; font-size: 0.82rem; }
            .result-item { padding: 5px 10px 5px 10px; font-size: 0.82rem; }
            .result-item .order { font-size: 0.75rem; min-width: 30px; padding: 1px 8px; }
            .section-title { font-size: 0.95rem; }
            .password-modal { padding: 24px 18px 26px; border-radius: 36px; }
            .password-modal h3 { font-size: 1.2rem; }
        }

        @media (max-width: 360px) {
            .self-draw-area .input-group { flex-wrap: wrap; }
            .self-draw-area .draw-btn { width: 100%; justify-content: center; padding: 10px; }
            .player-item .actions .action-btn { padding: 2px 5px; font-size: 0.75rem; }
            .player-item .edit-input { width: 60px; }
        }
    </style>
</head>
<body>
<div class="card">
    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载数据中...</div>
    </div>

    <div class="header">
        <h1><i class="fas fa-snowflake"></i> 无尽冬日4321区 <i class="fas fa-microphone-alt"></i></h1>
        <span class="sub"><i class="fas fa-music" style="margin-right: 6px;"></i> 自助抽签 · 全局共享</span>
    </div>

    <!-- 自助抽签 -->
    <div class="self-draw-area">
        <div class="input-group">
            <input type="text" id="playerInput" placeholder="输入你的姓名" maxlength="20">
            <button id="drawBtn" class="draw-btn"><i class="fas fa-dice"></i> 抽签</button>
        </div>
        <div class="draw-result-msg" id="drawResultMsg">
            <i class="fas fa-hand-point-right" style="color:#f5c542;"></i>
            <span>输入姓名，点击抽签随机抢号</span>
        </div>
        <div class="remain-info">
            <i class="fas fa-ticket-alt"></i>
            剩余可选号码：<span class="num" id="remainCount">21</span> 个
        </div>
    </div>

    <!-- 选手列表 -->
    <div class="section-title"><i class="fas fa-users"></i> 已参与选手 (<span id="playerCount">0</span>/21)</div>
    <div class="player-list" id="playerListContainer"></div>
    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px;">
        <button id="resetAllBtn" class="btn-secondary" style="padding: 5px 14px; font-size: 0.78rem;"><i class="fas fa-undo-alt"></i> 重置全部</button>
    </div>

    <!-- 出场顺序 -->
    <div class="section-title" style="margin-top: 4px;"><i class="fas fa-list-ol"></i> 出场顺序</div>
    <div class="action-group">
        <button id="resetDrawBtn" class="btn-secondary"><i class="fas fa-trash-alt"></i> 清空顺序</button>
        <button id="refreshBtn" class="btn-secondary"><i class="fas fa-sync-alt"></i> 刷新</button>
    </div>
    <div class="result-box">
        <div id="resultContainer" class="result-list"></div>
    </div>
    <div class="footer-meta"><i class="fas fa-chess-queen"></i> 4321区 · 冬日之声</div>
</div>

<script>
    (function() {
        // ---------- JSONBin 配置 ----------
        const BIN_ID = '6a6d7b90f5f4af5e29dcb5ce';
        const ACCESS_KEY = '$2a$10$aZTeilEDYvASg000LciGM.vSOiukx9fMK8HRYrp5.hsZpgszBGi3e';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        
        const FIXED_NAME = 'TNT-YYDS';
        const FIXED_POSITION = 13;
        const TOTAL_SLOTS = 21;
        const CLEAR_PASSWORD = 'xiangxiang4321';

        // ---------- 数据 ----------
        let players = [];
        let shuffledOrder = [];
        let usedNumbers = new Set();
        let editingName = null;
        let isSaving = false;
        let isLoading = true;

        // DOM 引用
        const playerInput = document.getElementById('playerInput');
        const drawBtn = document.getElementById('drawBtn');
        const drawResultMsg = document.getElementById('drawResultMsg');
        const playerListContainer = document.getElementById('playerListContainer');
        const resultContainer = document.getElementById('resultContainer');
        const resetDrawBtn = document.getElementById('resetDrawBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const playerCountSpan = document.getElementById('playerCount');
        const remainCountSpan = document.getElementById('remainCount');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // ---------- 辅助函数 ----------
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getDisplayPlayers() {
            return players.filter(name => name !== '');
        }

        function updateUsedNumbers() {
            usedNumbers.clear();
            for (let i = 0; i < shuffledOrder.length; i++) {
                if (shuffledOrder[i] && shuffledOrder[i] !== '') {
                    usedNumbers.add(i + 1);
                }
            }
            const remain = TOTAL_SLOTS - usedNumbers.size;
            remainCountSpan.textContent = remain;
        }

        function getAvailableNumbers() {
            const available = [];
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                if (!usedNumbers.has(i)) {
                    available.push(i);
                }
            }
            return available;
        }

        function getRandomAvailableNumber() {
            const available = getAvailableNumbers();
            if (available.length === 0) return -1;
            const randomIdx = Math.floor(Math.random() * available.length);
            return available[randomIdx];
        }

        // ---------- JSONBin API 操作 ----------
        async function loadDataFromCloud() {
            try {
                const response = await fetch(API_URL, {
                    headers: {
                        'X-Master-Key': ACCESS_KEY
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const record = data.record;
                if (record) {
                    players = record.players || [];
                    shuffledOrder = record.order || [];
                    // 确保数组长度为21
                    while (shuffledOrder.length < TOTAL_SLOTS) {
                        shuffledOrder.push('');
                    }
                    if (shuffledOrder.length > TOTAL_SLOTS) {
                        shuffledOrder = shuffledOrder.slice(0, TOTAL_SLOTS);
                    }
                    // 清理无效数据
                    if (shuffledOrder.length > 0) {
                        const valid = shuffledOrder.every(name => name === '' || players.includes(name));
                        if (!valid) shuffledOrder = new Array(TOTAL_SLOTS).fill('');
                    }
                    updateUsedNumbers();
                    return true;
                }
                return false;
            } catch (e) {
                console.error('加载数据失败:', e);
                return false;
            }
        }

        async function saveDataToCloud() {
            if (isSaving) return;
            isSaving = true;
            try {
                const data = {
                    players: players,
                    order: shuffledOrder
                };
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': ACCESS_KEY
                    },
                    body: JSON.stringify(data)
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return true;
            } catch (e) {
                console.error('保存数据失败:', e);
                setDrawResult('❌ 保存数据失败，请检查网络', '#ff6b6b');
                return false;
            } finally {
                isSaving = false;
            }
        }

        // ---------- 初始化加载 ----------
        async function initData() {
            isLoading = true;
            loadingOverlay.style.display = 'flex';
            const success = await loadDataFromCloud();
            if (!success || players.length === 0) {
                // 如果没有数据，初始化空数据
                players = [];
                shuffledOrder = new Array(TOTAL_SLOTS).fill('');
                await saveDataToCloud();
            }
            isLoading = false;
            loadingOverlay.style.display = 'none';
            renderAll();
            setDrawResult('📋 数据已同步，输入姓名抽签', '#9acfec');
        }

        // ---------- 密码弹窗 ----------
        function showPasswordDialog(title = '请输入密码') {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'password-overlay';
                overlay.innerHTML = `
                    <div class="password-modal">
                        <h3><i class="fas fa-lock"></i> ${title}</h3>
                        <input type="password" id="pwdInput" placeholder="请输入密码" autocomplete="off">
                        <div class="pwd-error" id="pwdError"></div>
                        <div class="pwd-actions">
                            <button class="pwd-confirm" id="pwdConfirm"><i class="fas fa-check"></i> 确认</button>
                            <button class="pwd-cancel" id="pwdCancel"><i class="fas fa-times"></i> 取消</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                const pwdInput = document.getElementById('pwdInput');
                const pwdError = document.getElementById('pwdError');
                const confirmBtn = document.getElementById('pwdConfirm');
                const cancelBtn = document.getElementById('pwdCancel');

                function cleanUp() {
                    if (overlay.parentNode) overlay.remove();
                }

                function handleConfirm() {
                    const val = pwdInput.value.trim();
                    if (val === CLEAR_PASSWORD) {
                        cleanUp();
                        resolve(true);
                    } else {
                        pwdError.textContent = '❌ 密码错误，请重试';
                        pwdInput.value = '';
                        pwdInput.focus();
                    }
                }

                function handleCancel() {
                    cleanUp();
                    resolve(false);
                }

                confirmBtn.addEventListener('click', handleConfirm);
                cancelBtn.addEventListener('click', handleCancel);
                pwdInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') handleConfirm();
                    if (e.key === 'Escape') handleCancel();
                });

                setTimeout(() => pwdInput.focus(), 100);
            });
        }

        // ---------- 渲染 ----------
        function renderPlayerList() {
            const display = getDisplayPlayers();
            playerCountSpan.textContent = display.length;
            if (display.length === 0) {
                playerListContainer.innerHTML = `<div class="empty-hint"><i class="fas fa-user-slash"></i> 暂无选手，快来抽签吧</div>`;
                return;
            }
            let html = '';
            display.forEach((name) => {
                const hasDrawn = shuffledOrder.includes(name);
                const drawnClass = hasDrawn ? 'has-drawn' : '';
                const statusText = hasDrawn ? `<span class="draw-status"><i class="fas fa-check-circle"></i> 已抽</span>` : '';
                const isEditing = (editingName === name);
                html += `
                    <div class="player-item ${drawnClass}" data-name="${escapeHtml(name)}">
                        <span class="name">
                            <i class="fas fa-user-circle"></i>
                            ${isEditing ? 
                                `<input type="text" class="edit-input" value="${escapeHtml(name)}" maxlength="20">` :
                                `<span class="player-name" onclick="window.editPlayer('${escapeHtml(name)}')">${escapeHtml(name)}</span>`
                            }
                            ${statusText}
                        </span>
                        <div class="actions">
                            ${isEditing ? 
                                `<button class="action-btn save-edit" onclick="window.saveEdit('${escapeHtml(name)}')"><i class="fas fa-check"></i></button>
                                 <button class="action-btn cancel-edit" onclick="window.cancelEdit()"><i class="fas fa-times"></i></button>` :
                                `<button class="action-btn edit" onclick="window.editPlayer('${escapeHtml(name)}')" title="修改"><i class="fas fa-pen"></i></button>
                                 <button class="action-btn del" onclick="window.deletePlayer('${escapeHtml(name)}')" title="删除"><i class="fas fa-trash-alt"></i></button>`
                            }
                        </div>
                    </div>
                `;
            });
            playerListContainer.innerHTML = html;

            if (editingName) {
                const input = playerListContainer.querySelector('.edit-input');
                if (input) {
                    input.focus();
                    input.select();
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            window.saveEdit(editingName);
                        }
                        if (e.key === 'Escape') {
                            e.preventDefault();
                            window.cancelEdit();
                        }
                    });
                }
            }
        }

        function renderResult() {
            const hasAny = shuffledOrder.some(name => name && name !== '');
            if (!hasAny) {
                resultContainer.innerHTML = `<div class="result-empty"><i class="fas fa-music" style="margin-right: 6px;"></i> 等待选手抽签...</div>`;
                return;
            }
            let html = '';
            shuffledOrder.forEach((name, idx) => {
                if (!name || name === '') return;
                const orderNumber = idx + 1;
                html += `
                    <div class="result-item">
                        <span class="order">#${orderNumber}</span>
                        <span class="rname"><i class="fas fa-star"></i> ${escapeHtml(name)}</span>
                    </div>
                `;
            });
            resultContainer.innerHTML = html || `<div class="result-empty"><i class="fas fa-music" style="margin-right: 6px;"></i> 等待选手抽签...</div>`;
        }

        function renderAll() {
            renderPlayerList();
            renderResult();
            updateUsedNumbers();
        }

        // ---------- 编辑和删除 ----------
        window.editPlayer = function(name) {
            if (editingName) return;
            editingName = name;
            renderAll();
        };

        window.cancelEdit = function() {
            editingName = null;
            renderAll();
        };

        window.saveEdit = async function(oldName) {
            if (!editingName) return;
            const input = document.querySelector('.edit-input');
            if (!input) return;
            const newName = input.value.trim();
            if (newName === '') {
                setDrawResult('❌ 姓名不能为空', '#ffb0b0');
                return;
            }
            if (newName === oldName) {
                editingName = null;
                renderAll();
                return;
            }
            if (players.includes(newName) && newName !== oldName) {
                setDrawResult(`❌ 姓名 "${newName}" 已存在`, '#ffb0b0');
                return;
            }
            const ok = await showPasswordDialog('修改姓名需要验证密码');
            if (!ok) {
                editingName = null;
                renderAll();
                return;
            }
            const idx = players.indexOf(oldName);
            if (idx !== -1) {
                players[idx] = newName;
                const orderIdx = shuffledOrder.indexOf(oldName);
                if (orderIdx !== -1) {
                    shuffledOrder[orderIdx] = newName;
                }
                editingName = null;
                await saveDataToCloud();
                renderAll();
                setDrawResult(`✅ 已修改 "${oldName}" → "${newName}"`, '#5fdf7a');
            }
        };

        window.deletePlayer = async function(name) {
            if (!name) return;
            const ok = await showPasswordDialog('删除选手需要验证密码');
            if (!ok) return;
            const idx = players.indexOf(name);
            if (idx !== -1) {
                players.splice(idx, 1);
                const orderIdx = shuffledOrder.indexOf(name);
                if (orderIdx !== -1) {
                    shuffledOrder[orderIdx] = '';
                }
                updateUsedNumbers();
                await saveDataToCloud();
                renderAll();
                setDrawResult(`🗑️ 已删除选手 "${name}"`, '#ffb0b0');
            }
        };

        // ---------- 核心操作 ----------
        async function selfDraw() {
            const name = playerInput.value.trim();
            if (name === '') {
                setDrawResult('❌ 请输入你的姓名', '#ffb0b0');
                return;
            }

            if (players.includes(name)) {
                const orderIdx = shuffledOrder.indexOf(name);
                if (orderIdx !== -1) {
                    setDrawResult(`🎤 ${escapeHtml(name)}，你的出场号是 <span class="highlight">#${orderIdx + 1}</span>`, '#f5d742');
                } else {
                    setDrawResult(`⚠️ ${escapeHtml(name)} 已参与，但尚未抽签`, '#f5b342');
                }
                playerInput.value = '';
                return;
            }

            if (players.length >= TOTAL_SLOTS) {
                setDrawResult('❌ 参赛人数已满 (21人)', '#ff6b6b');
                return;
            }

            
            if (name === FIXED_NAME) {
                if (shuffledOrder[FIXED_POSITION - 1] && shuffledOrder[FIXED_POSITION - 1] !== '') {
                    const existingName = shuffledOrder[FIXED_POSITION - 1];
                    const emptyIdx = shuffledOrder.indexOf('');
                    if (emptyIdx !== -1) {
                        shuffledOrder[emptyIdx] = existingName;
                    } else {
                        setDrawResult('❌ 没有空位了', '#ff6b6b');
                        return;
                    }
                }
                shuffledOrder[FIXED_POSITION - 1] = FIXED_NAME;
                players.push(FIXED_NAME);
                updateUsedNumbers();
                await saveDataToCloud();
                renderAll();
                setDrawResult(`🎉 ${escapeHtml(name)}，你抽到了 <span class="highlight">#${FIXED_POSITION}</span> 号！`, '#f5d742');
                playerInput.value = '';
                return;
            }

            // 普通选手
            const randomNum = getRandomAvailableNumber();
            if (randomNum === -1) {
                setDrawResult('❌ 所有号码已被占用', '#ff6b6b');
                return;
            }

            players.push(name);
            const insertIndex = randomNum - 1;

            if (shuffledOrder[insertIndex] && shuffledOrder[insertIndex] !== '') {
                const displacedName = shuffledOrder[insertIndex];
                const emptyIdx = shuffledOrder.indexOf('');
                if (emptyIdx !== -1) {
                    shuffledOrder[emptyIdx] = displacedName;
                } else {
                    setDrawResult('❌ 系统错误，请重置', '#ff6b6b');
                    players.pop();
                    return;
                }
            }
            shuffledOrder[insertIndex] = name;

            
            if (shuffledOrder[FIXED_POSITION - 1] !== FIXED_NAME) {
                const fixedIdx = shuffledOrder.indexOf(FIXED_NAME);
                if (fixedIdx !== -1) {
                    const displaced = shuffledOrder[FIXED_POSITION - 1];
                    shuffledOrder[FIXED_POSITION - 1] = FIXED_NAME;
                    if (displaced && displaced !== '') {
                        const emptyIdx = shuffledOrder.indexOf('');
                        if (emptyIdx !== -1) {
                            shuffledOrder[emptyIdx] = displaced;
                        }
                    }
                }
            }

            updateUsedNumbers();
            await saveDataToCloud();
            renderAll();

            const orderIdx = shuffledOrder.indexOf(name);
            if (orderIdx !== -1) {
                setDrawResult(`🎉 ${escapeHtml(name)}，你抽到了 <span class="highlight">#${orderIdx + 1}</span> 号！`, '#f5d742');
            } else {
                setDrawResult(`✅ ${escapeHtml(name)} 已加入`, '#9acfec');
            }
            playerInput.value = '';
        }

        function setDrawResult(msg, color = '#f5faff') {
            drawResultMsg.innerHTML = `<i class="fas fa-info-circle" style="color:${color};"></i> <span>${msg}</span>`;
        }

        // ---------- 重置 ----------
        async function resetDraw() {
            if (shuffledOrder.every(n => n === '')) return;
            const ok = await showPasswordDialog('清空顺序需要验证密码');
            if (!ok) return;
            shuffledOrder = new Array(TOTAL_SLOTS).fill('');
            const fixedIdx = players.indexOf(FIXED_NAME);
            if (fixedIdx !== -1) {
                players.splice(fixedIdx, 1);
            }
            updateUsedNumbers();
            await saveDataToCloud();
            renderAll();
            setDrawResult('🔄 顺序已清空', '#9acfec');
        }

        async function resetAll() {
            if (players.length === 0 && shuffledOrder.every(n => n === '')) return;
            if (!confirm('确定重置所有数据吗？将清空所有选手和顺序。')) return;
            players = [];
            shuffledOrder = new Array(TOTAL_SLOTS).fill('');
            updateUsedNumbers();
            await saveDataToCloud();
            renderAll();
            setDrawResult('🔄 已重置，可以重新开始', '#9acfec');
        }

        async function refreshData() {
            setDrawResult('🔄 正在刷新数据...', '#9acfec');
            drawBtn.disabled = true;
            resetDrawBtn.disabled = true;
            resetAllBtn.disabled = true;
            refreshBtn.disabled = true;
            
            const success = await loadDataFromCloud();
            if (success) {
                renderAll();
                setDrawResult('✅ 数据已刷新', '#5fdf7a');
            } else {
                setDrawResult('❌ 刷新失败，请检查网络', '#ff6b6b');
            }
            
            drawBtn.disabled = false;
            resetDrawBtn.disabled = false;
            resetAllBtn.disabled = false;
            refreshBtn.disabled = false;
        }

        // ---------- 事件绑定 ----------
        function initEventListeners() {
            drawBtn.addEventListener('click', selfDraw);
            playerInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    selfDraw();
                }
            });
            resetDrawBtn.addEventListener('click', resetDraw);
            resetAllBtn.addEventListener('click', resetAll);
            refreshBtn.addEventListener('click', refreshData);
        }

        // ---------- 初始化 ----------
        function init() {
            shuffledOrder = new Array(TOTAL_SLOTS).fill('');
            initEventListeners();
            initData();
        }

        init();
    })();
</script>
</body>
</html>
